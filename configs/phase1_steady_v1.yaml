# Phase 1: steady-state 2D flow through a stenosed channel.
# All quantities are nondimensional (length by H, velocity by U0).

geometry:
  H: 1.0              # channel height (nondimensional reference length)
  Lx: 5.0             # domain length, in units of H
  stenosis_x0: 2.0    # stenosis center, in units of H
  stenosis_pct_ds: 50 # percent diameter stenosis (clinical severity metric)
  stenosis_sigma: 0.4 # Gaussian bump width, in units of H
  eccentric: true     # one-sided (eccentric) bump vs. symmetric

grid:
  # 320x64 looked adequate on paper but produces a spurious, unbounded
  # velocity spike at the stenosis's staircase corners for pct_ds >= 30
  # (a known artifact of simple immersed-boundary masking, not a physical
  # instability -- see dev-log 2026-08-26). 640x128 resolves it cleanly.
  nx: 640
  ny: 128

flow:
  U0: 1.0             # inlet mean velocity (nondimensional reference)
  reynolds: 200       # Re = U0 * H / nu

solver:
  cfl_safety: 0.5
  convergence_tol: 1.0e-6
  max_steps: 20000

sensors:
  n_points: 20
  wall_margin_frac: 0.08   # exclude this fraction of H near any wall/stenosis surface
  noise_level: 0.07        # fraction of U0, additive Gaussian
  seed: 0

pinn:
  # Tuned for CPU-only training: a bigger network (7x48) + 4000 collocation
  # points timed out at ~55 min for 15000 epochs (each collocation point
  # needs second-order autograd, which dominates cost -- the collocation
  # count matters more than the parameter count). The ~7-10 min figure in
  # dev-log 2026-08-26 was measured on this network at adam_epochs=8000,
  # BEFORE the nu-recovery debugging raised it to 15000; a full run at the
  # current settings is correspondingly longer and has not been re-timed.
  hidden_layers: 6
  hidden_units: 32
  adam_lr: 1.0e-3
  adam_epochs: 15000
  lbfgs_iters: 300
  nu_lr_scale: 0.3  # see dev-log 2026-08-26: 1.0 overshot, 0.1 undershot
  loss_weights:
    data: 100.0
    pde: 1.0
    bc: 10.0
  collocation_points: 1500
  resample_every: 200
  seed: 0
